---
# tasks file for gofile role

- name: Check if supervisor is installed
  ansible.builtin.command: which supervisorctl
  register: supervisor_check
  changed_when: false
  failed_when: false
  tags: [supervisor]

- name: Install supervisor if not present
  ansible.builtin.apt:
    name: supervisor
    state: present
  when: supervisor_check.rc != 0
  tags: [supervisor]

- name: Create installation directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    recurse: yes
  loop:
    - "{{ gofile_dir }}"
    - "{{ gofile_dir }}/logs"
    - "{{ gofile_dir }}/files"
  tags: [dir]

- name: Download and extract gofile binary from GitHub
  block:
    - name: Download gofile archive
      ansible.builtin.get_url:
        url: "{{ gofile_binary_url }}"
        dest: /tmp/gofile-linux.tar.gz
        mode: '0644'
        force: yes

    - name: Extract gofile binary
      ansible.builtin.unarchive:
        src: /tmp/gofile-linux.tar.gz
        dest: "{{ gofile_dir }}"
        remote_src: yes
        creates: "{{ gofile_dir }}/gofile-linux"

    - name: Set executable permission
      ansible.builtin.file:
        path: "{{ gofile_dir }}/gofile-linux"
        mode: '0755'

    - name: Clean up archive
      ansible.builtin.file:
        path: /tmp/gofile-linux.tar.gz
        state: absent
  tags: [sync, update]

- name: Deploy supervisor configuration
  block:
    - name: Create supervisor config
      ansible.builtin.template:
        src: "supervisor/gofile.conf.j2"
        dest: "/etc/supervisor/conf.d/gofile.conf"
        owner: root
        group: root
        mode: '0644'
        backup: yes

    - name: Ensure supervisor is enabled
      ansible.builtin.service:
        name: supervisor
        enabled: yes
        state: started

    - name: Reload and restart gofile
      ansible.builtin.shell: >
        supervisorctl reread &&
        supervisorctl update &&
        supervisorctl restart gofile
  tags: [conf, start, update]
