# defaults file for gofile role

# Whether to use the current ansible user (true) or create a dedicated user (false)
gofile_using_cur_user: true
gofile_user: gofile

# Installation directory
gofile_dir: /srv/gofile

# GitHub release version ("latest" for newest release, or specific tag like "v1.0.0")
gofile_version: latest

# Binary download URL
gofile_binary_url: "https://github.com/mars-base/gofile/releases/{{ gofile_version }}/download/gofile-linux.tar.gz"

# --- Instance list ---
# Each entry deploys a separate gofile instance with its own port, directory and extra args.
# extra_args supports all gofile flags, e.g.:
#   -gzip
#   -upload -uploadSize 50
#   -cache -cacheSize 2 -cacheTime 15
#   -auth -authString "admin:pass123"
#   -cert /path/cert.pem -key /path/key.pem
gofile_list:
  - port: 8080
    dir: /srv/gofile/8080
    extra_args: ""
  - port: 8081
    dir: /srv/gofile/8081
    extra_args: ""
