name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: gofile-linux
          - os: windows
            arch: amd64
            output: gofile.exe
          - os: darwin
            arch: amd64
            output: gofile-darwin-amd64
          - os: darwin
            arch: arm64
            output: gofile-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
            -ldflags "-s -w -X 'main.gVersion=${{ github.ref_name }}'" \
            -o ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release archives
        run: |
          mkdir -p release

          # Linux
          cp gofile-linux/gofile-linux release/
          cd release && tar -czf gofile-linux.tar.gz gofile-linux && rm gofile-linux && cd ..

          # Windows
          cp gofile.exe/gofile.exe release/
          cd release && zip gofile.zip gofile.exe && rm gofile.exe && cd ..

          # macOS amd64
          cp gofile-darwin-amd64/gofile-darwin-amd64 release/
          cd release && tar -czf gofile-darwin-amd64.tar.gz gofile-darwin-amd64 && rm gofile-darwin-amd64 && cd ..

          # macOS arm64
          cp gofile-darwin-arm64/gofile-darwin-arm64 release/
          cd release && tar -czf gofile-darwin-arm64.tar.gz gofile-darwin-arm64 && rm gofile-darwin-arm64 && cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.tar.gz
            release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
